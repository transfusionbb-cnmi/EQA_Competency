<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blood Bank EQA Learning System 2026</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">EQA</div>
        <div>
          <h1>BB EQA 2026</h1>
          <p>Learning & Competency</p>
        </div>
      </div>

      <nav>
        <button class="nav-btn active" data-page="dashboard">Dashboard</button>
        <button class="nav-btn" data-page="cases">Cases 2026</button>
        <button class="nav-btn" data-page="myAnswers">My Answers</button>
        <button class="nav-btn" data-page="reflection">Reflection</button>
        <button class="nav-btn" data-page="qmReview">QM Review</button>
        <button class="nav-btn" data-page="physicianAck">Physician Acknowledge</button>
        <button class="nav-btn" data-page="reports">Reports</button>
        <button class="nav-btn" data-page="admin">Admin</button>
      </nav>

      <div class="user-box">
        <div id="currentUserName">ยังไม่ได้เข้าสู่ระบบ</div>
        <small id="currentUserRole">-</small>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="hamburger" id="toggleSidebar">☰</button>
        <div>
          <h2 id="pageTitle">Dashboard</h2>
          <p>ระบบฝึกแปลผล EQA / CAP สำหรับปี 2026</p>
        </div>
        <button class="secondary-btn" id="logoutBtn">ออกจากระบบ</button>
      </header>

      <section id="loginPage" class="page-card">
        <h2>เข้าสู่ระบบ</h2>
        <p class="muted">กรอกรหัสพนักงานเพื่อเข้าใช้งาน</p>
        <div class="form-grid">
          <label>รหัสพนักงาน
            <input id="loginEmpCode" placeholder="เช่น 12345" />
          </label>
          <label>ชื่อ-สกุล
            <input id="loginFullName" placeholder="ใช้กรณีเข้าครั้งแรก" />
          </label>
        </div>
        <button class="primary-btn" id="loginBtn">เข้าสู่ระบบ</button>
      </section>

      <section id="contentPage" class="content hidden"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <h3 id="modalTitle">ยืนยัน</h3>
      <p id="modalMessage"></p>
      <div class="modal-actions">
        <button class="secondary-btn" id="modalCancel">กลับไปตรวจสอบ</button>
        <button class="danger-btn" id="modalConfirm">ยืนยันส่งคำตอบ</button>
      </div>
    </div>
  </div>

  <script>
    window.API_URL = "PASTE_APPS_SCRIPT_WEB_APP_URL_HERE";
  </script>
  <script src="app.js"></script>
</body>
</html>
